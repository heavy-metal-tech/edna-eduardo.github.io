services:
  # API Backend (Node.js + Neon/Postgres)
  - type: web
    name: api-ee-imoveis
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false   # preencher no painel do Render
      - key: JWT_SECRET
        sync: false   # preencher no painel do Render
      - key: ADMIN_USER
        sync: false   # padrão: admin
      - key: ADMIN_HASH
        sync: false   # hash bcrypt da senha do admin

  # Frontend (HTML estático)
  - type: web
    name: ee-imoveis-site
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
